; winter: the values above are cm of snow on the day itself
; recent snow: how closely the snowfall of the days before the scored day
; follows a steady recent_ideal cm per day (2 x 7 = a line from 0 to 14 cm)
recent_days        = 7
recent_ideal       = 2
recent_weight      = 1.0
; how much snow above the ideal line counts, relative to snow below it
recent_over_weight = 0.1
; rain on the day: more than rain_max mm adds rain_step_weight
rain_max           = 0
rain_step_weight   = 10
sig_snow_1  = 10
sig_snow_2  = 20
sig_snow_3  = 30


[avalanche]
low          = 0
moderate     = 0.5
considerable = 2
high         = 10     ; same size as your step-function vetoes
extreme      = 10
unknown      = 0.5    ; the prior for "in a region, no rating"
earlyseason  = 0.5
